<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento - IoT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Painel de Medição de Distância</h1>
        
        <div class="card-atual">
            <h2>Última Distância</h2>
            <div id="distancia-atual">-- cm</div>
            <small id="data-atual">Aguardando dados...</small>
        </div>

        <h2>Histórico de Medições</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Distância (cm)</th>
                    <th>Data e Hora</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- Linhas preenchidas via JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
